<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHRASE BOARD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Zen+Maru+Gothic:wght@500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #fff8ec;
    --card: #ffffff;
    --coral: #ff6f91;
    --leaf: #34c98e;
    --sun: #ffc93c;
    --sky: #3aa6ff;
    --grape: #a15de8;
    --ink: #23262e;
    --ink-soft: #6b7080;
    --line: #efe4cf;
    --radius: 20px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Zen Maru Gothic', sans-serif;
    min-height:100vh;
    padding:0 0 70px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:980px;margin:0 auto;padding:0 20px;}

  /* ---------- hero ---------- */
  .hero{
    position:relative;
    overflow:hidden;
    background:
      conic-gradient(from 200deg at 50% 30%,
        #ff6f91, #ffc93c, #34c98e, #3aa6ff, #a15de8, #ff6f91);
    padding:44px 20px 54px;
    margin-bottom:26px;
    border-radius:0 0 36px 36px;
    box-shadow:0 8px 0 rgba(0,0,0,0.06);
  }
  .hero::before{
    content:"";
    position:absolute;
    inset:0;
    background:radial-gradient(ellipse 70% 60% at 50% 0%, rgba(255,255,255,0.35), rgba(255,255,255,0) 65%);
    pointer-events:none;
  }
  .sparkle{
    position:absolute;
    color:#fff;
    opacity:0.85;
    text-shadow:0 0 6px rgba(0,0,0,0.08);
    pointer-events:none;
    user-select:none;
  }
  .hero-inner{
    position:relative;
    max-width:980px;
    margin:0 auto;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:10px;
  }
  .title{
    font-family:'Fredoka', 'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size:clamp(34px,6vw,54px);
    margin:0;
    letter-spacing:0.01em;
    color:#fff;
    -webkit-text-stroke:7px #fff;
    paint-order:stroke fill;
    display:flex;
    gap:2px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .title span{ -webkit-text-stroke:7px #fff; paint-order:stroke fill; }
  .title .c1{color:#ff3b6b;}
  .title .c2{color:#ff9c1a;}
  .title .c3{color:#ffd400;}
  .title .c4{color:#2ecc71;}
  .title .c5{color:#22b4e8;}
  .title .c6{color:#b15be0;}
  .subtitle{
    font-family:'JetBrains Mono', monospace;
    font-size:12.5px;
    font-weight:700;
    letter-spacing:0.08em;
    color:#fff;
    background:rgba(0,0,0,0.18);
    padding:6px 14px;
    border-radius:100px;
  }
  .status-chip{
    margin-top:4px;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    font-weight:700;
    color:var(--ink);
    background:#fff;
    padding:8px 16px;
    border-radius:100px;
    box-shadow:0 3px 0 rgba(0,0,0,0.08);
  }
  .status-chip b{color:var(--coral);}

  /* ---------- transport card ---------- */
  .transport{
    background:var(--card);
    border:3px solid var(--line);
    border-radius:var(--radius);
    padding:20px;
    margin-bottom:22px;
    box-shadow:0 5px 0 var(--line);
  }
  .transport-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:14px;
  }
  .transport-row.random-row{
    grid-template-columns:auto 1fr auto;
    align-items:center;
  }
  @media (max-width:640px){
    .transport-row{grid-template-columns:1fr;}
    .transport-row.random-row{grid-template-columns:1fr;}
  }

  .tab-bar{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:8px;
    background:#f4f5f9;
    border-radius:14px;
    padding:6px;
    margin-bottom:14px;
  }
  @media (max-width:560px){
    .tab-bar{grid-template-columns:repeat(2, 1fr);}
  }
  .tab-btn{
    font-family:'Fredoka','Zen Maru Gothic', sans-serif;
    font-weight:600;
    font-size:13px;
    border:none;
    background:transparent;
    color:var(--ink-soft);
    border-radius:10px;
    padding:11px 8px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    transition:background .15s ease, color .15s ease;
  }
  .tab-btn:hover{color:var(--ink);}
  .tab-btn.active{color:#fff;box-shadow:0 3px 0 rgba(0,0,0,0.12);}
  .tab-btn[data-tab="order"].active{background:var(--sky);}
  .tab-btn[data-tab="random"].active{background:var(--coral);}
  .tab-btn[data-tab="infinite"].active{background:var(--grape);}
  .tab-btn[data-tab="custom"].active{background:var(--sun);}

  .tab-panel{display:none;margin-bottom:14px;}
  .tab-panel.active{display:block;}
  .tab-panel .btn{width:100%;}
  .tab-panel .random-inline{
    display:grid;
    grid-template-columns:1fr auto;
    gap:10px;
    align-items:center;
    margin-bottom:10px;
  }
  @media (max-width:520px){
    .tab-panel .random-inline{grid-template-columns:1fr;}
  }

  .custom-queue{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    min-height:44px;
    background:#fffaf0;
    border:2px dashed #ffe2b0;
    border-radius:12px;
    padding:10px;
    margin-bottom:10px;
  }
  .custom-empty{
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--ink-soft);
    align-self:center;
  }
  .queue-chip{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:12px;
    border:none;
    color:#fff;
    background:var(--chip-color, var(--grape));
    border-radius:8px;
    padding:7px 10px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
    box-shadow:0 2px 0 rgba(0,0,0,0.12);
  }
  .queue-chip:hover{filter:brightness(1.08);}
  .custom-actions{
    display:grid;
    grid-template-columns:1fr auto;
    gap:10px;
  }
  .custom-actions .btn{background:var(--sun);}
  .btn.clear-custom{
    background:#f4f5f9;
    color:var(--ink-soft);
    box-shadow:0 4px 0 #e3e5ec;
    width:auto;
    padding:15px 18px;
  }

  .stop-row{margin-bottom:14px;}
  .stop-row .btn{width:100%;}

  .btn{
    font-family:'Fredoka','Zen Maru Gothic', sans-serif;
    font-weight:600;
    font-size:15px;
    border:none;
    border-radius:14px;
    padding:15px 16px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    color:#fff;
    box-shadow:0 4px 0 rgba(0,0,0,0.15);
    transition:transform .1s ease, box-shadow .1s ease, filter .1s ease;
  }
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,0.15);}
  .btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;transform:none;}
  .btn:hover:not(:disabled){filter:brightness(1.06);}
  .btn.order{background:var(--sky);}
  .btn.random{background:var(--coral);}
  .btn.infinite{background:var(--grape);}
  .btn.stop{background:var(--ink);}
  .btn .icon{font-size:16px;line-height:1;}

  .count-box{
    display:flex;
    align-items:center;
    gap:8px;
    background:#fff2f6;
    border:2px solid #ffd6e2;
    border-radius:14px;
    padding:8px 12px;
    justify-self:stretch;
  }
  .count-box label{
    font-size:12px;
    font-weight:700;
    color:var(--coral);
    white-space:nowrap;
  }
  .count-box input[type=number]{
    width:56px;
    border:2px solid #ffd6e2;
    border-radius:8px;
    padding:6px 4px;
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:14px;
    color:var(--ink);
  }

  .speed-block{
    background:#f2f8ff;
    border:2px solid #d7ebff;
    border-radius:14px;
    padding:12px 16px;
    margin-bottom:14px;
  }
  .speed-block .speed-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:6px;
    font-size:12.5px;
    font-weight:700;
    color:var(--sky);
  }
  .speed-block .speed-top #speedValue{
    font-family:'JetBrains Mono', monospace;
    background:#fff;
    padding:2px 10px;
    border-radius:100px;
    color:var(--ink);
  }
  input[type=range]{
    width:100%;
    accent-color:var(--sky);
    height:6px;
  }
  .speed-scale{
    position:relative;
    height:14px;
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .speed-scale span{
    position:absolute;
    top:0;
    transform:translateX(-50%);
    white-space:nowrap;
  }
  .speed-scale span:first-child{left:0;transform:translateX(0);}
  .speed-scale span:last-child{left:100%;transform:translateX(-100%);}

  .toggle-row{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    font-weight:700;
    color:var(--ink-soft);
  }
  .toggle-row input{accent-color:var(--coral);width:16px;height:16px;}

  /* ---------- pads ---------- */
  .bookend-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
  }
  .bookend{margin:0;}
  .bookend.compact .pad{padding:8px 10px;gap:4px;}
  .bookend.compact .pad-label{font-size:12px;padding:1px 0 2px;}
  .bookend.compact .filename{font-size:9px;}
  .bookend.compact .pad-play{font-size:11px;padding:6px 4px;}
  .bookend.compact .file-label,
  .bookend.compact .clear-btn{width:28px;height:28px;font-size:13px;}
  .bookend.compact .pad-num{font-size:10px;padding:1px 6px;}
  .bookend.compact .pad-lamp{width:7px;height:7px;}

  .rail-label{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.1em;
    color:var(--ink-soft);
    margin:22px 4px 10px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .rail-label::after{
    content:"";
    flex:1;
    height:2px;
    background:var(--line);
    border-radius:2px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:12px;
  }
  @media (max-width:640px){
    .grid{grid-template-columns:repeat(2, 1fr);}
  }

  .pad{
    position:relative;
    background:var(--card);
    border:3px solid var(--line);
    border-radius:16px;
    padding:12px;
    display:flex;
    flex-direction:column;
    gap:8px;
    box-shadow:0 4px 0 var(--line);
    transition:border-color .15s ease, box-shadow .15s ease, transform .1s ease;
  }
  .pad.filled{border-color:var(--pad-color, var(--sky));box-shadow:0 4px 0 var(--pad-color, var(--sky));}
  .pad.playing{transform:translateY(2px);box-shadow:0 2px 0 var(--pad-color, var(--sky));}
  .pad.bookend-pad{flex-direction:row;align-items:center;}

  .pad-top{display:flex;justify-content:space-between;align-items:center;gap:6px;}
  .pad-num{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:11px;
    color:#c9cddb;
    background:#f4f5f9;
    padding:2px 8px;
    border-radius:100px;
  }
  .pad.filled .pad-num{color:#fff;background:var(--pad-color, var(--sky));}
  .pad-lamp{
    width:9px;height:9px;border-radius:50%;
    background:#e8e5dc;
    flex:none;
  }
  .pad.playing .pad-lamp{
    background:var(--pad-color, var(--coral));
    box-shadow:0 0 8px 2px var(--pad-color, var(--coral));
  }

  .pad-label{
    background:transparent;
    border:none;
    border-bottom:2px solid transparent;
    color:var(--ink);
    font-family:'Zen Maru Gothic', sans-serif;
    font-size:14px;
    font-weight:700;
    padding:2px 0 4px;
    width:100%;
  }
  .pad-label:focus{outline:none;border-bottom-color:var(--pad-color, var(--coral));}
  .pad-label::placeholder{color:#c9cddb;}

  .pad-controls{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:auto;
  }
  .pad-play{
    flex:1;
    background:#f4f5f9;
    border:none;
    border-radius:10px;
    color:var(--ink);
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size:12px;
    padding:9px 6px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
  }
  .pad-play:hover:not(:disabled){background:var(--pad-color, var(--sky));color:#fff;}
  .pad-play:disabled{opacity:.4;cursor:not-allowed;}

  .file-label{
    background:#f4f5f9;
    border:none;
    border-radius:10px;
    color:var(--ink-soft);
    font-size:15px;
    width:36px;height:36px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    flex:none;
  }
  .file-label:hover{background:var(--sun);color:#fff;}
  .file-label input{display:none;}

  .clear-btn{
    background:transparent;
    border:none;
    color:#d8dbe4;
    font-size:15px;
    width:28px;height:28px;
    cursor:pointer;
    flex:none;
    display:flex;align-items:center;justify-content:center;
  }
  .clear-btn:hover{color:var(--coral);}

  .add-btn{
    background:#f4f5f9;
    border:none;
    border-radius:10px;
    color:var(--ink-soft);
    font-size:15px;
    width:36px;height:36px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    flex:none;
  }
  .add-btn:hover{background:var(--pad-color, var(--grape));color:#fff;}

  .filename{
    font-family:'JetBrains Mono', monospace;
    font-size:10px;
    color:#c9cddb;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:100%;
  }
  .pad.filled .filename{color:var(--pad-color, var(--sky));}

  .bookend-body{flex:1;min-width:0;}
  .bookend .pad-controls{margin-top:6px;}

  footer{
    text-align:center;
    margin-top:36px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    padding:0 20px;
  }
</style>
</head>
<body>

  <div class="hero">
    <span class="sparkle" style="top:14%;left:8%;font-size:22px;">✦</span>
    <span class="sparkle" style="top:60%;left:5%;font-size:14px;">✧</span>
    <span class="sparkle" style="top:20%;right:9%;font-size:18px;">✦</span>
    <span class="sparkle" style="top:65%;right:12%;font-size:24px;">✧</span>
    <span class="sparkle" style="top:38%;left:18%;font-size:12px;">✦</span>
    <span class="sparkle" style="top:75%;right:28%;font-size:12px;">✦</span>
    <div class="hero-inner">
      <h1 class="title">
        <span class="c1">ド</span><span class="c2">ゥ</span><span class="c3">ン</span><span class="c4">ド</span><span class="c5">ゥ</span><span class="c6">ン</span
        ><span class="c1">メ</span><span class="c2">ー</span><span class="c3">カ</span><span class="c4">ー</span>
      </h1>
    </div>
  </div>

  <div class="wrap">

    <div class="transport">
      <div class="tab-bar">
        <button class="tab-btn active" data-tab="order"><span class="icon">▶</span>順番に再生</button>
        <button class="tab-btn" data-tab="random"><span class="icon">🔀</span>ランダム再生</button>
        <button class="tab-btn" data-tab="infinite"><span class="icon">♾</span>無限ランダム</button>
        <button class="tab-btn" data-tab="custom"><span class="icon">🔢</span>カスタム再生</button>
      </div>

      <div class="tab-panel active" id="panel-order">
        <button class="btn order" id="playOrderBtn"><span class="icon">▶</span>この順番で再生</button>
      </div>

      <div class="tab-panel" id="panel-random">
        <div class="random-inline">
          <button class="btn random" id="playRandomCountBtn"><span class="icon">🔀</span>ランダム再生</button>
          <div class="count-box">
            <label for="randomCountInput">回数</label>
            <input type="number" id="randomCountInput" value="8" min="1" max="99">
          </div>
        </div>
      </div>

      <div class="tab-panel" id="panel-infinite">
        <button class="btn infinite" id="infiniteBtn"><span class="icon">♾</span>無限ランダム再生</button>
      </div>

      <div class="tab-panel" id="panel-custom">
        <div class="custom-queue" id="customQueueList">
          <div class="custom-empty">各フレーズの ➕ ボタンで再生順を追加してください</div>
        </div>
        <div class="custom-actions">
          <button class="btn" id="playCustomBtn"><span class="icon">▶</span>この順番で再生</button>
          <button class="btn clear-custom" id="clearCustomBtn">クリア</button>
        </div>
      </div>

      <div class="stop-row">
        <button class="btn stop" id="stopBtn"><span class="icon">■</span>停止</button>

      </div>

      <div class="speed-block">
        <div class="speed-top"><span>再生速度</span><span id="speedValue">1.00x</span></div>
        <input type="range" id="speedSlider" min="0.25" max="2" step="0.05" value="1">
        <div class="speed-scale"><span>0.25x</span><span style="left:42.857%;">1.0x</span><span>2.0x</span></div>
      </div>

      <div class="toggle-row">
        <input type="checkbox" id="includeBookends" checked>
        <label for="includeBookends">連続再生にイントロ・アウトロを含める</label>
      </div>
    </div>

    <div class="rail-label">PHRASES 1–16</div>
    <div class="grid" id="phraseGrid"></div>

    <div class="rail-label">INTRO / OUTRO</div>
    <div class="bookend-row">
      <div class="bookend compact" id="pad-intro"></div>
      <div class="bookend compact outro" id="pad-outro"></div>

<script>
(function(){
  const PHRASE_COUNT = 16;
  const PAD_COLORS = ['#ff6f91','#ff9c1a','#ffc93c','#34c98e','#22b4e8','#3aa6ff','#a15de8','#ff6f91','#ff9c1a','#ffc93c','#34c98e','#22b4e8','#3aa6ff','#a15de8','#ff9c1a','#34c98e'];

  const slots = [];
  slots.push({ id:'intro', kind:'bookend', label:'イントロ', file:null, buffer:null });
  for(let i=1;i<=PHRASE_COUNT;i++){
    slots.push({ id:'p'+i, kind:'phrase', num:i, label:'フレーズ '+i, file:null, buffer:null, color: PAD_COLORS[i-1] });
  }
  slots.push({ id:'outro', kind:'bookend', label:'アウトロ', file:null, buffer:null });

  let audioCtx = null;
  function getCtx(){
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  const introHost = document.getElementById('pad-intro');
  const outroHost = document.getElementById('pad-outro');
  const grid = document.getElementById('phraseGrid');
  const includeBookends = document.getElementById('includeBookends');
  const playOrderBtn = document.getElementById('playOrderBtn');
  const playRandomCountBtn = document.getElementById('playRandomCountBtn');
  const infiniteBtn = document.getElementById('infiniteBtn');
  const stopBtn = document.getElementById('stopBtn');
  const randomCountInput = document.getElementById('randomCountInput');
  const speedSlider = document.getElementById('speedSlider');
  const speedValue = document.getElementById('speedValue');
  const tabBtns = document.querySelectorAll('.tab-btn');
  const tabPanels = {
    order: document.getElementById('panel-order'),
    random: document.getElementById('panel-random'),
    infinite: document.getElementById('panel-infinite'),
    custom: document.getElementById('panel-custom'),
  };

  function activateTab(tab){
    tabBtns.forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
    Object.keys(tabPanels).forEach(key => tabPanels[key].classList.toggle('active', key === tab));
  }

  tabBtns.forEach(btn => {
    btn.addEventListener('click', () => activateTab(btn.dataset.tab));
  });

  let currentlyPlayingId = null;
  let sequenceActive = false;
  let infiniteActive = false;
  let infiniteTimer = null;
  let playbackRate = 1;
  let customQueueIds = [];

  speedSlider.addEventListener('input', () => {
    playbackRate = parseFloat(speedSlider.value);
    speedValue.textContent = playbackRate.toFixed(2) + 'x';
  });

  function loadedCount(){
    return slots.filter(s => s.file).length;
  }

  function setBusyButtons(busy){
    playOrderBtn.disabled = busy;
    playRandomCountBtn.disabled = busy;
    infiniteBtn.disabled = busy;
  }

  function updateStatus(){
    // status chip UI removed; function kept as a no-op so existing calls remain safe.
  }

  function buildPad(slot){
    const pad = document.createElement('div');
    pad.className = slot.kind === 'bookend' ? 'pad bookend-pad' : 'pad';
    pad.id = 'padcard-' + slot.id;
    if(slot.color) pad.style.setProperty('--pad-color', slot.color);

    const body = document.createElement('div');
    body.className = slot.kind === 'bookend' ? 'bookend-body' : '';

    const top = document.createElement('div');
    top.className = 'pad-top';

    const numEl = document.createElement('span');
    numEl.className = 'pad-num';
    numEl.textContent = slot.kind === 'bookend' ? slot.id.toUpperCase() : ('#' + String(slot.num).padStart(2,'0'));

    const lamp = document.createElement('span');
    lamp.className = 'pad-lamp';

    top.appendChild(numEl);
    top.appendChild(lamp);

    const labelInput = document.createElement('input');
    labelInput.className = 'pad-label';
    labelInput.value = slot.label;
    labelInput.placeholder = '名前を入力';
    labelInput.addEventListener('input', () => { slot.label = labelInput.value; });

    const filenameEl = document.createElement('div');
    filenameEl.className = 'filename';
    filenameEl.textContent = 'ファイル未読み込み';

    body.appendChild(top);
    body.appendChild(labelInput);
    body.appendChild(filenameEl);

    const controls = document.createElement('div');
    controls.className = 'pad-controls';

    const playBtn = document.createElement('button');
    playBtn.className = 'pad-play';
    playBtn.disabled = true;
    playBtn.innerHTML = '▶ 再生';
    playBtn.addEventListener('click', () => {
      stopSequence();
      playSingle(slot);
    });

    const fileLabel = document.createElement('label');
    fileLabel.className = 'file-label';
    fileLabel.title = '音声ファイルを読み込む';
    fileLabel.textContent = '📁';
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'audio/*';
    fileInput.addEventListener('change', async (e) => {
      const f = e.target.files[0];
      if(!f) return;
      filenameEl.textContent = '読み込み中…';
      pad.classList.add('filled');
      try{
        await setSlotFile(slot, f);
        filenameEl.textContent = f.name;
        playBtn.disabled = false;
        clearBtn.style.display = 'flex';
      }catch(err){
        filenameEl.textContent = '読み込み失敗（対応音声形式か確認してください）';
        pad.classList.remove('filled');
        slot.file = null;
        slot.buffer = null;
      }
      updateStatus();
    });
    fileLabel.appendChild(fileInput);

    const clearBtn = document.createElement('button');
    clearBtn.className = 'clear-btn';
    clearBtn.textContent = '✕';
    clearBtn.style.display = 'none';
    clearBtn.title = '読み込んだ音声を削除';
    clearBtn.addEventListener('click', () => {
      clearSlotFile(slot);
      filenameEl.textContent = 'ファイル未読み込み';
      playBtn.disabled = true;
      pad.classList.remove('filled');
      clearBtn.style.display = 'none';
      fileInput.value = '';
      updateStatus();
    });

    controls.appendChild(playBtn);
    controls.appendChild(fileLabel);
    controls.appendChild(clearBtn);

    let addBtn = null;
    if(slot.kind === 'phrase'){
      addBtn = document.createElement('button');
      addBtn.className = 'add-btn';
      addBtn.textContent = '➕';
      addBtn.title = 'カスタム再生の順番に追加';
      addBtn.addEventListener('click', () => {
        customQueueIds.push(slot.id);
        renderCustomQueue();
        activateTab('custom');
      });
      controls.appendChild(addBtn);
    }

    body.appendChild(controls);

    pad.appendChild(body);

    slot._el = { pad, lamp, playBtn, filenameEl, clearBtn, labelInput, addBtn };
    return pad;
  }

  slots.forEach(slot => {
    const pad = buildPad(slot);
    if(slot.id === 'intro'){
      introHost.appendChild(pad);
    } else if(slot.id === 'outro'){
      outroHost.appendChild(pad);
    } else {
      grid.appendChild(pad);
    }
  });

  let activeSources = [];
  let visualTimers = [];

  async function setSlotFile(slot, file){
    const ctx = getCtx();
    const arrayBuffer = await file.arrayBuffer();
    const buffer = await ctx.decodeAudioData(arrayBuffer);
    slot.file = file;
    slot.buffer = buffer;
  }

  function clearSlotFile(slot){
    slot.file = null;
    slot.buffer = null;
  }

  function setPlayingVisual(slot, isPlaying){
    if(!slot._el) return;
    slot._el.pad.classList.toggle('playing', isPlaying);
  }

  function clearVisualTimers(){
    visualTimers.forEach(t => clearTimeout(t));
    visualTimers = [];
  }

  function stopAllSources(){
    activeSources.forEach(src => {
      try{ src.onended = null; src.stop(); }catch(e){}
      try{ src.disconnect(); }catch(e){}
    });
    activeSources = [];
    clearVisualTimers();
    slots.forEach(s => setPlayingVisual(s, false));
  }

  function playSingle(slot){
    if(!slot.buffer) return;
    stopAllSources();
    const ctx = getCtx();
    const source = ctx.createBufferSource();
    source.buffer = slot.buffer;
    source.playbackRate.value = playbackRate;
    source.connect(ctx.destination);
    currentlyPlayingId = slot.id;
    setPlayingVisual(slot, true);
    source.onended = () => {
      setPlayingVisual(slot, false);
      if(currentlyPlayingId === slot.id) currentlyPlayingId = null;
      activeSources = activeSources.filter(s => s !== source);
      updateStatus();
    };
    source.start();
    activeSources.push(source);
    updateStatus();
  }

  function buildOrderQueue(){
    const bookends = includeBookends.checked;
    const q = [];
    const intro = slots.find(s=>s.id==='intro');
    const outro = slots.find(s=>s.id==='outro');
    if(bookends && intro.file) q.push(intro);
    slots.filter(s=>s.kind==='phrase' && s.file).forEach(s=>q.push(s));
    if(bookends && outro.file) q.push(outro);
    return q;
  }

  function pickRandomMiddle(){
    const pool = slots.filter(s=>s.kind==='phrase' && s.file);
    if(pool.length === 0) return null;
    return pool[Math.floor(Math.random() * pool.length)];
  }

  function buildRandomCountQueue(n){
    const bookends = includeBookends.checked;
    const intro = slots.find(s=>s.id==='intro');
    const outro = slots.find(s=>s.id==='outro');
    const q = [];
    if(bookends && intro.file) q.push(intro);
    for(let i=0;i<n;i++){
      const pick = pickRandomMiddle();
      if(pick) q.push(pick);
    }
    if(bookends && outro.file) q.push(outro);
    return q;
  }

  function buildCustomQueue(){
    const bookends = includeBookends.checked;
    const intro = slots.find(s=>s.id==='intro');
    const outro = slots.find(s=>s.id==='outro');
    const q = [];
    if(bookends && intro.file) q.push(intro);
    customQueueIds.forEach(id => {
      const slot = slots.find(s => s.id === id);
      if(slot && slot.file) q.push(slot);
    });
    if(bookends && outro.file) q.push(outro);
    return q;
  }

  const customQueueList = document.getElementById('customQueueList');
  function renderCustomQueue(){
    customQueueList.innerHTML = '';
    if(customQueueIds.length === 0){
      const empty = document.createElement('div');
      empty.className = 'custom-empty';
      empty.textContent = '各フレーズの ➕ ボタンで再生順を追加してください';
      customQueueList.appendChild(empty);
      return;
    }
    customQueueIds.forEach((id, idx) => {
      const slot = slots.find(s => s.id === id);
      if(!slot) return;
      const chip = document.createElement('button');
      chip.className = 'queue-chip';
      chip.style.setProperty('--chip-color', slot.color || '#a15de8');
      chip.textContent = String(slot.num).padStart(2,'0') + ' ✕';
      chip.title = 'クリックで削除';
      chip.addEventListener('click', () => {
        customQueueIds.splice(idx, 1);
        renderCustomQueue();
      });
      customQueueList.appendChild(chip);
    });
  }

  // ---- gapless scheduled queue playback (used by sequential + counted random) ----
  function playQueue(queue){
    stopSequence();
    if(queue.length === 0){
      alert('再生できる音声がまだ読み込まれていません。パッドの📁アイコンから音声ファイルを追加してください。');
      return;
    }
    const ctx = getCtx();
    sequenceActive = true;
    setBusyButtons(true);
    updateStatus();

    const startAt = ctx.currentTime + 0.05;
    let cursor = startAt;

    queue.forEach((slot, i) => {
      const source = ctx.createBufferSource();
      source.buffer = slot.buffer;
      source.playbackRate.value = playbackRate;
      source.connect(ctx.destination);
      const when = cursor;
      const duration = slot.buffer.duration / playbackRate;
      source.start(when);
      activeSources.push(source);

      const onDelayMs = Math.max(0, (when - ctx.currentTime) * 1000);
      const offDelayMs = Math.max(0, (when + duration - ctx.currentTime) * 1000);
      visualTimers.push(setTimeout(() => { currentlyPlayingId = slot.id; setPlayingVisual(slot, true); updateStatus(); }, onDelayMs));
      visualTimers.push(setTimeout(() => { setPlayingVisual(slot, false); }, offDelayMs));

      if(i === queue.length - 1){
        source.onended = () => {
          activeSources = activeSources.filter(s => s !== source);
          finishSequence();
        };
      }
      cursor += duration;
    });
  }

  // ---- infinite random: schedule in gapless chunks, extending as it plays ----
  const INFINITE_CHUNK = 6;
  let infiniteCursor = 0;

  function scheduleInfiniteChunk(){
    if(!infiniteActive) return;
    const pool = slots.filter(s=>s.kind==='phrase' && s.file);
    if(pool.length === 0){ stopInfinite(); return; }
    const ctx = getCtx();

    for(let i=0;i<INFINITE_CHUNK;i++){
      const slot = pool[Math.floor(Math.random() * pool.length)];
      const source = ctx.createBufferSource();
      source.buffer = slot.buffer;
      source.playbackRate.value = playbackRate;
      source.connect(ctx.destination);
      const when = infiniteCursor;
      const duration = slot.buffer.duration / playbackRate;
      source.start(when);
      activeSources.push(source);
      source.onended = () => { activeSources = activeSources.filter(s => s !== source); };

      const onDelayMs = Math.max(0, (when - ctx.currentTime) * 1000);
      const offDelayMs = Math.max(0, (when + duration - ctx.currentTime) * 1000);
      visualTimers.push(setTimeout(() => { if(infiniteActive){ currentlyPlayingId = slot.id; setPlayingVisual(slot, true); updateStatus(); } }, onDelayMs));
      visualTimers.push(setTimeout(() => { setPlayingVisual(slot, false); }, offDelayMs));

      infiniteCursor += duration;
    }

    // queue the next chunk shortly before this one finishes so it stays gapless
    const ctxNow = ctx.currentTime;
    const leadMs = Math.max(50, (infiniteCursor - ctxNow - 1.2) * 1000);
    infiniteTimer = setTimeout(scheduleInfiniteChunk, leadMs);
  }

  function startInfinite(){
    const pool = slots.filter(s=>s.kind==='phrase' && s.file);
    if(pool.length === 0){
      alert('再生できるフレーズがまだ読み込まれていません。パッドの📁アイコンから音声ファイルを追加してください。');
      return;
    }
    stopSequence();
    const ctx = getCtx();
    infiniteActive = true;
    setBusyButtons(true);
    updateStatus();

    const bookends = includeBookends.checked;
    const intro = slots.find(s=>s.id==='intro');
    infiniteCursor = ctx.currentTime + 0.05;

    if(bookends && intro.file){
      const source = ctx.createBufferSource();
      source.buffer = intro.buffer;
      source.playbackRate.value = playbackRate;
      source.connect(ctx.destination);
      const when = infiniteCursor;
      const duration = intro.buffer.duration / playbackRate;
      source.start(when);
      activeSources.push(source);
      source.onended = () => { activeSources = activeSources.filter(s => s !== source); };
      const onDelayMs = Math.max(0, (when - ctx.currentTime) * 1000);
      const offDelayMs = Math.max(0, (when + duration - ctx.currentTime) * 1000);
      visualTimers.push(setTimeout(() => { setPlayingVisual(intro, true); }, onDelayMs));
      visualTimers.push(setTimeout(() => { setPlayingVisual(intro, false); }, offDelayMs));
      infiniteCursor += duration;
    }

    scheduleInfiniteChunk();
  }

  function stopInfinite(){
    infiniteActive = false;
    if(infiniteTimer){ clearTimeout(infiniteTimer); infiniteTimer = null; }
  }

  function finishSequence(){
    sequenceActive = false;
    currentlyPlayingId = null;
    setBusyButtons(false);
    clearVisualTimers();
    slots.forEach(s => setPlayingVisual(s, false));
    updateStatus();
  }

  function stopSequence(){
    stopInfinite();
    stopAllSources();
    sequenceActive = false;
    currentlyPlayingId = null;
    setBusyButtons(false);
    updateStatus();
  }

  function base64ToArrayBuffer(base64){
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);
    for(let i=0;i<binary.length;i++) bytes[i] = binary.charCodeAt(i);
    return bytes.buffer;
  }

  async function preloadEmbeddedAudio(){
    const jsonEl = document.getElementById('embeddedAudio');
    if(!jsonEl) return;
    let data;
    try{ data = JSON.parse(jsonEl.textContent); }catch(e){ return; }

    const ctx = getCtx();
    const entries = Object.keys(data);

    await Promise.all(entries.map(async (slotId) => {
      const slot = slots.find(s => s.id === slotId);
      if(!slot) return;
      const entry = data[slotId];
      try{
        const commaIdx = entry.data.indexOf(',');
        const base64 = entry.data.slice(commaIdx + 1);
        const arrayBuffer = base64ToArrayBuffer(base64);
        const buffer = await ctx.decodeAudioData(arrayBuffer);
        slot.buffer = buffer;
        slot.file = { name: entry.filename };
        if(slot._el){
          slot._el.labelInput.value = entry.label;
          slot.label = entry.label;
          slot._el.filenameEl.textContent = entry.filename;
          slot._el.playBtn.disabled = false;
          slot._el.clearBtn.style.display = 'flex';
          slot._el.pad.classList.add('filled');
        }
      }catch(err){
        if(slot._el) slot._el.filenameEl.textContent = '読み込み失敗';
      }
    }));

    updateStatus();
  }

  playOrderBtn.addEventListener('click', () => playQueue(buildOrderQueue()));
  playRandomCountBtn.addEventListener('click', () => {
    const n = Math.max(1, Math.min(99, parseInt(randomCountInput.value, 10) || 1));
    playQueue(buildRandomCountQueue(n));
  });
  infiniteBtn.addEventListener('click', startInfinite);
  stopBtn.addEventListener('click', stopSequence);

  const playCustomBtn = document.getElementById('playCustomBtn');
  const clearCustomBtn = document.getElementById('clearCustomBtn');
  playCustomBtn.addEventListener('click', () => playQueue(buildCustomQueue()));
  clearCustomBtn.addEventListener('click', () => { customQueueIds = []; renderCustomQueue(); });

  renderCustomQueue();
  preloadEmbeddedAudio();
  updateStatus();
})();
</script>
</body>
